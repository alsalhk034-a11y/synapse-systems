name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check (verbose)
        run: |
          echo "=== tsc -b --verbose output ==="
          npx tsc -b --verbose 2>&1 | tee tsc-output.log || true
          echo "=== END ==="
        continue-on-error: true

      - name: Upload tsc logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-logs
          path: tsc-output.log
          if-no-files-found: ignore

      - name: Build (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: List dist directory
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/ 2>&1 || echo "no dist dir"
          echo "=== assets/ contents ==="
          ls -la dist/assets/ 2>&1 || echo "no assets"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
